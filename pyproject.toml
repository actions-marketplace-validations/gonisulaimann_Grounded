[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded"
version = "0.2.0"
description = "The epistemic linter: proves your comments wrong with evidence. Deterministic, offline, zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["lint", "comments", "documentation", "static-analysis", "tech-debt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
grounded = "grounded.cli:main"

[project.urls]
Homepage = "https://example.com/grounded"

[tool.setuptools.packages.find]
where = ["src"]

[tool.grounded]
fail_on = "lie"
