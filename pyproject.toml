[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-lint"
version = "0.7.1"
description = "Find dangling references in code comments. Deterministic, offline, zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["lint", "comments", "documentation", "static-analysis", "tech-debt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
grounded = "grounded.cli:main"

[project.urls]
Homepage = "https://github.com/gonisulaimann/Grounded"
Changelog = "https://github.com/gonisulaimann/Grounded/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grounded = ["py.typed"]

[tool.grounded]
fail_on = "lie"
