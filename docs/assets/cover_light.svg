<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <linearGradient id="g-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="border-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="896" height="256" rx="16" fill="url(#bg-grad-light)" stroke="url(#border-grad-light)" stroke-width="2"/>

  <!-- Logo Icon Left -->
  <g transform="translate(60, 45)">
    <!-- Ground horizontal bars -->
    <line x1="30" y1="120" x2="130" y2="120" stroke="url(#g-grad-light)" stroke-width="5" stroke-linecap="round"/>
    <line x1="45" y1="134" x2="115" y2="134" stroke="url(#g-grad-light)" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="148" x2="100" y2="148" stroke="url(#g-grad-light)" stroke-width="5" stroke-linecap="round"/>
    <!-- Vertical grounding wire -->
    <line x1="80" y1="20" x2="80" y2="120" stroke="url(#g-grad-light)" stroke-width="5" stroke-linecap="round"/>
    <!-- Code Brackets < > -->
    <polyline points="62,55 42,75 62,95" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="98,55 118,75 98,95" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography Right -->
  <g transform="translate(230, 0)">
    <!-- Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#0F172A" letter-spacing="3">GROUNDED</text>
    <text x="320" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="url(#g-grad-light)">⚡</text>

    <!-- Subtitle -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#475569" letter-spacing="0.5">The 0.6ms Reference &amp; Import Integrity Firewall for AI Coding Agents</text>

    <!-- Tagline pills / badges -->
    <g transform="translate(0, 160)">
      <!-- Pill 1: 0.6ms Latency -->
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0284C7" text-anchor="middle">⚡ 0.6ms In-Process</text>

      <!-- Pill 2: Zero Deps -->
      <rect x="140" y="0" width="140" height="32" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="210" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4F46E5" text-anchor="middle">🛡️ Zero Dependencies</text>

      <!-- Pill 3: Native LSP & MCP -->
      <rect x="290" y="0" width="145" height="32" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="362" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#059669" text-anchor="middle">🔌 LSP 3.17 &amp; MCP</text>

      <!-- Pill 4: Python & TS/JS -->
      <rect x="445" y="0" width="150" height="32" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="520" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#DB2777" text-anchor="middle">🐍 Python · 📜 TS/JS</text>
    </g>

    <!-- Bottom metadata line -->
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">Deterministic · Offline · Pure Standard Library · macOS, Linux &amp; Windows</text>
  </g>
</svg>
