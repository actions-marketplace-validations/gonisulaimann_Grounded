<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <linearGradient id="g-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312E81" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="896" height="256" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2"/>

  <!-- Glowing background flare -->
  <circle cx="140" cy="130" r="90" fill="#6366F1" opacity="0.12" filter="blur(30px)"/>

  <!-- Logo Icon Left -->
  <g transform="translate(60, 45)">
    <!-- Glow layer -->
    <g filter="url(#glow)" opacity="0.6">
      <!-- Ground horizontal bars -->
      <line x1="30" y1="120" x2="130" y2="120" stroke="url(#g-grad)" stroke-width="5" stroke-linecap="round"/>
      <line x1="45" y1="134" x2="115" y2="134" stroke="url(#g-grad)" stroke-width="5" stroke-linecap="round"/>
      <line x1="60" y1="148" x2="100" y2="148" stroke="url(#g-grad)" stroke-width="5" stroke-linecap="round"/>
      <!-- Vertical grounding wire -->
      <line x1="80" y1="20" x2="80" y2="120" stroke="url(#g-grad)" stroke-width="5" stroke-linecap="round"/>
      <!-- Code Brackets < > -->
      <polyline points="62,55 42,75 62,95" fill="none" stroke="url(#g-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="98,55 118,75 98,95" fill="none" stroke="url(#g-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Crisp foreground layer -->
    <!-- Ground horizontal bars -->
    <line x1="30" y1="120" x2="130" y2="120" stroke="url(#g-grad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="45" y1="134" x2="115" y2="134" stroke="url(#g-grad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="60" y1="148" x2="100" y2="148" stroke="url(#g-grad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Vertical wire -->
    <line x1="80" y1="20" x2="80" y2="120" stroke="url(#g-grad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Brackets -->
    <polyline points="62,55 42,75 62,95" fill="none" stroke="#E0E7FF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="98,55 118,75 98,95" fill="none" stroke="#E0E7FF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography Right -->
  <g transform="translate(230, 0)">
    <!-- Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="3">GROUNDED</text>
    <text x="320" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="url(#g-grad)">⚡</text>

    <!-- Subtitle -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94A3B8" letter-spacing="0.5">The 0.6ms Reference &amp; Import Integrity Firewall for AI Coding Agents</text>

    <!-- Tagline pills / badges -->
    <g transform="translate(0, 160)">
      <!-- Pill 1: 0.6ms Latency -->
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38BDF8" text-anchor="middle">⚡ 0.6ms In-Process</text>

      <!-- Pill 2: Zero Deps -->
      <rect x="140" y="0" width="140" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="210" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#A5B4FC" text-anchor="middle">🛡️ Zero Dependencies</text>

      <!-- Pill 3: Native LSP & MCP -->
      <rect x="290" y="0" width="145" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="362" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#34D399" text-anchor="middle">🔌 LSP 3.17 &amp; MCP</text>

      <!-- Pill 4: Python & TS/JS -->
      <rect x="445" y="0" width="150" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="520" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F472B6" text-anchor="middle">🐍 Python · 📜 TS/JS</text>
    </g>

    <!-- Bottom metadata line -->
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">Deterministic · Offline · Pure Standard Library · macOS, Linux &amp; Windows</text>
  </g>
</svg>
