name: Release Standalone Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            binary_name: grounded-linux-amd64
            sep: ":"
          - os: macos-latest
            target: darwin-arm64
            binary_name: grounded-darwin-arm64
            sep: ":"
          - os: macos-13
            target: darwin-amd64
            binary_name: grounded-darwin-amd64
            sep: ":"
          - os: windows-latest
            target: windows-amd64
            binary_name: grounded-windows-amd64.exe
            sep: ";"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build standalone binary (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile \
            --name ${{ matrix.binary_name }} \
            --paths src \
            --add-data "src/grounded/skill${{ matrix.sep }}grounded/skill" \
            --clean \
            src/grounded/__main__.py
          chmod +x dist/${{ matrix.binary_name }}
          ./dist/${{ matrix.binary_name }} --version
          ./dist/${{ matrix.binary_name }} scan src

      - name: Build standalone binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onefile `
            --name ${{ matrix.binary_name }} `
            --paths src `
            --add-data "src/grounded/skill${{ matrix.sep }}grounded/skill" `
            --clean `
            src/grounded/__main__.py
          & .\dist\${{ matrix.binary_name }} --version
          & .\dist\${{ matrix.binary_name }} scan src

      - name: Upload binary to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.binary_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}
