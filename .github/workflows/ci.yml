name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Standalone tests (stdlib unittest without install)
        run: python -m unittest discover -s tests
      - name: Install
        run: pip install -e .
      - name: Tests (stdlib unittest with package)
        run: python -m unittest discover -s tests
      - name: Dogfood gate (self-scan must stay clean)
        run: grounded scan src --no-color
      - name: Demo fixtures still diagnosed
        run: test "$(grounded scan examples/v2demo --format json | python -c 'import json,sys; print(len(json.load(sys.stdin)))')" = "10"

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Precision corpus (exact-match, no slop)
        run: python3 corpus/run.py

  self-verify:
    # Dogfood: every opt-in checker over our own docs must stay clean.
    # Corpus fixtures plant violations on purpose and are excluded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e .
      - name: Docs integrity sweep (all opt-ins, must report clean)
        run: |
          OPTS=stale-doc-ref,stale-contract-ref,ghost-export,stale-entrypoint,stale-mock-ref,phantom-package,stale-cli-ref,unclosed-fence
          for target in docs README.md agent-skill CHANGELOG.md bench demo editors; do
            grounded scan "$target" --no-color --fail-on smell --enable "$OPTS"
          done

  action-dogfood:
    name: GitHub Action Dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dogfood local action checkout (source mode with SARIF output)
        uses: ./
        with:
          version: source
          path: src
          fail-on: lie
          sarif-file: results.sarif
      - name: Verify SARIF file was generated
        run: |
          test -f results.sarif
          python3 -c "import json; d = json.load(open('results.sarif')); assert d['version'] == '2.1.0'"

