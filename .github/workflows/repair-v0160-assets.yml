# One-off repair (2026-09-23): the v0.16.0 release event ran while the
# macOS leg was still broken, so `grounded-darwin-amd64` was never
# uploaded and the daily asset audit is red. This rebuilds nothing: it
# fetches the CI-attested universal2 artifact from the green
# workflow_dispatch run, re-verifies both architectures, and appends both
# historical names to the existing v0.16.0 release. Delete this file
# after the audit turns green.
name: Repair v0.16.0 macOS assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Fetch the attested universal2 artifact
        uses: actions/download-artifact@v4
        with:
          name: darwin-universal2
          path: dist
          run-id: 35899372140
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-verify both architectures
        run: |
          set -eu
          lipo -archs dist/grounded-darwin-arm64
          for want in arm64 x86_64; do
            case " $(lipo -archs dist/grounded-darwin-arm64) " in
              *" ${want} "*) ;;
              *) echo "::error::artifact is missing ${want}"; exit 1 ;;
            esac
          done
          cp dist/grounded-darwin-arm64 dist/grounded-darwin-amd64
      - name: Append both names to v0.16.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.16.0
          files: |
            dist/grounded-darwin-arm64
            dist/grounded-darwin-amd64
